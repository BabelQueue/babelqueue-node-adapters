name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [ "18", "20", "22", "24" ]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  lint:
    name: Static analysis (ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: ESLint
        run: npm run lint

  coverage:
    name: Coverage gate (>=90% lines)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # Build first: the nestjs tests import the built @babelqueue/bullmq workspace
      # package (now linked locally via the ^1.0.0 dependency), so its dist/ must exist.
      - name: Build
        run: npm run build
      - name: Coverage
        run: npm run coverage

  conformance:
    name: Conformance suite in sync
    runs-on: ubuntu-latest
    env:
      BQ_CONFORMANCE_VERSION: 1.8.0
      # sha256 of that release's fetch.sh: the script runs on the runner, so it is pinned rather than
      # trusted from a mutable tag. Bump together with BQ_CONFORMANCE_VERSION.
      BQ_FETCH_SH_SHA256: 8bb6ba567b288fb0ac71a70fd17041b2503df119e01998d76fdad372570bf849
    steps:
      - uses: actions/checkout@v7
      - name: Verify vendored conformance matches the pinned release asset
        # @babelqueue/sqs, @babelqueue/azure-service-bus, @babelqueue/pulsar, @babelqueue/kafka,
        # @babelqueue/artemis, @babelqueue/redis, @babelqueue/rabbitmq and @babelqueue/bullmq each vendor the conformance
        # suite (for their binding tests); guard every copy against drift.
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/fetch.sh" \
            "https://raw.githubusercontent.com/BabelQueue/conformance/v${BQ_CONFORMANCE_VERSION}/fetch.sh"
          echo "${BQ_FETCH_SH_SHA256}  $RUNNER_TEMP/fetch.sh" | sha256sum -c -
          # Download + verify the release asset once, then compare every vendored copy with it
          # (what `fetch.sh --check` does per copy, minus the repeated download). LICENSE is not vendored.
          bash "$RUNNER_TEMP/fetch.sh" "$BQ_CONFORMANCE_VERSION" "$RUNNER_TEMP/conformance"
          for pkg in sqs azure-service-bus pulsar kafka artemis redis rabbitmq bullmq; do
            diff -r -x LICENSE "$RUNNER_TEMP/conformance" "packages/$pkg/test/conformance"
            echo "in sync: packages/$pkg/test/conformance (conformance $BQ_CONFORMANCE_VERSION)"
          done

  redis:
    name: Redis live (redis_layout + Lua integration)
    # Required check: the live Redis tests (conformance `redis_layout`, the Lua scripts, kill-9 /
    # late-ack recovery) must run for real here. BQ_REQUIRE_REDIS turns an unreachable Redis into a
    # failure instead of the local-dev skip, so this job can never go green by skipping.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BQ_REQUIRE_REDIS: "1"
      BABELQUEUE_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v7

      # The `runner` context is not available in job-level `env`, so the results path is exported here.
      - name: Set conformance results path
        run: echo "BQ_CONFORMANCE_RESULTS=${RUNNER_TEMP}/results.json" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Redis tests (live Redis, no skips)
        run: npm run test -w @babelqueue/redis

      # The bullmq adapter creates the `Queue` of a `deadLetterQueue: true | "<name>"` itself; that path needs Redis.
      - name: BullMQ tests (live Redis for the deadLetterQueue Queue creation)
        run: npm run test -w @babelqueue/bullmq

      - name: Assert no conformance failures
        run: |
          node -e '
            const fs = require("fs");
            const f = process.env.BQ_CONFORMANCE_RESULTS.replace(".json", ".redis.json");
            const d = JSON.parse(fs.readFileSync(f, "utf8"));
            const c = { pass: 0, fail: 0, skip: 0 };
            for (const cases of Object.values(d.sections)) for (const r of Object.values(cases)) c[r.status] += 1;
            console.log(JSON.stringify(c));
            if (c.fail > 0 || c.skip > 0) process.exit(1);
          '

  integration:
    name: Integration (live Kafka + Artemis)
    # Opt-in, not a required check: runs on push to main and on demand, never on pull requests,
    # and is deliberately NOT in ci-green's needs.
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      kafka:
        image: apache/kafka:3.9.0
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 10s --health-timeout 10s --health-retries 12 --health-start-period 20s
      artemis:
        image: apache/activemq-artemis:2.37.0
        ports:
          - 5672:5672
          - 61616:61616
        env:
          ARTEMIS_USER: artemis
          ARTEMIS_PASSWORD: artemis
        options: >-
          --health-cmd "/var/lib/artemis-instance/bin/artemis check node --up --user artemis --password artemis"
          --health-interval 10s --health-timeout 10s --health-retries 12 --health-start-period 20s
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # kafkajs and rhea are optional peers of the adapters, so they are not workspace dependencies;
      # install them for this job only (pinned) without touching package.json / the lockfile.
      - name: Install optional peers
        run: npm install --no-save kafkajs@2.2.4 rhea@3.0.5

      - name: Kafka integration tests
        working-directory: packages/kafka
        env:
          BQ_INTEGRATION: "1"
          BQ_KAFKA_BROKERS: localhost:9092
        run: node --import tsx --test test/kafka-integration.test.ts

      - name: Artemis integration tests
        working-directory: packages/artemis
        env:
          BQ_INTEGRATION: "1"
          BQ_ARTEMIS_HOST: localhost
          BQ_ARTEMIS_PORT: "5672"
          BQ_ARTEMIS_USER: artemis
          BQ_ARTEMIS_PASSWORD: artemis
        run: node --import tsx --test test/artemis-integration.test.ts

  ci-green:
    name: CI green
    runs-on: ubuntu-latest
    needs: [test, lint, coverage, conformance, redis]
    if: ${{ always() }}
    steps:
      - name: Fail if any required job did not pass
        run: |
          if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}; then
            echo "A required job failed or was cancelled."
            exit 1
          fi
